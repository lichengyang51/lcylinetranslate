
name: Build Inno Setup installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the approved app package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:RUNNER_TEMP 'line-release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          gh release download v1.0.12 --repo $env:GITHUB_REPOSITORY --pattern 'LineTranslate-1.0.12-win-x64.zip' --dir $releaseDir
          $appDir = Join-Path $env:RUNNER_TEMP 'line-app'
          Expand-Archive -LiteralPath (Join-Path $releaseDir 'LineTranslate-1.0.12-win-x64.zip') -DestinationPath $appDir -Force
          "LINE_APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $outputDir = Join-Path $env:RUNNER_TEMP 'line-installer'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          "LINE_OUTPUT_DIR=$outputDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup Compiler
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Download Simplified Chinese language
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl' -OutFile '.github\installer\ChineseSimplified.isl'

      - name: Build the Chinese installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Get-ChildItem -Path @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe') -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup Compiler was not found.' }
          & $compiler.FullName '.github\installer\LineTranslate-1.0.12.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Replace the release installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:LINE_OUTPUT_DIR 'LcyLineTranslate_Setup_v1.0.12.exe'
          gh release upload v1.0.12 "$installer#LcyLineTranslate_Setup_v1.0.12.exe" --clobber --repo $env:GITHUB_REPOSITORY
          gh release delete-asset v1.0.12 'LineTranslate-1.0.12-win-x64.zip' --yes --repo $env:GITHUB_REPOSITORY
